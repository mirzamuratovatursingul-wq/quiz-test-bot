# Bot + API uchun Render.com konfiguratsiyasi (uzluksiz ishlaydigan jarayon).
# Mini App Vercel'da, bot esa shu yerda turadi.
services:
  - type: web
    name: testrace-bot
    runtime: node
    plan: starter          # Free rejada xizmat uxlab qoladi — bot javob bermay qoladi
    region: frankfurt
    buildCommand: npm ci && npm run fonts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: 'false'     # Mini App Vercel'da tarqatiladi
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WEBAPP_URL
        sync: false        # Vercel bergan manzil
